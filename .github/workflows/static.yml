name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - run: vp install
      - run: vp check --no-fmt
      - run: vp lint --type-aware

  test:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - run: vp install
      - run: vp run test

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - run: vp install
      - run: python3 data/json_to_sqlite.py
      - run: vp build

      - name: Verify built assets
        run: |
          for page in index.html india.html seating.html sound.html; do
            if [ ! -f "dist/$page" ]; then
              echo "FAIL: dist/$page missing"; exit 1;
            fi
            echo "OK: dist/$page exists"
          done
          for asset in $(grep -ohP 'href="\K[^"]+\.css' dist/index.html); do
            if [ ! -f "dist/${asset#/theater-tech/}" ]; then
              echo "FAIL: $asset missing"; exit 1;
            fi
            echo "OK: $asset"
          done
          for html in dist/*.html; do
            for asset in $(grep -ohP '(href|src)="\K(/theater-tech/assets/[^"]+)' "$html"); do
              file="dist/${asset#/theater-tech/}";
              if [ ! -f "$file" ]; then echo "FAIL: $asset missing in $html"; exit 1; fi
              echo "OK: $asset"
            done
          done
          echo "All assets verified"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - uses: actions/deploy-pages@v5
