<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <title>India Cinema Heatmap — Theater Tech Comparison</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/src/styles/style.css">
    <link rel="stylesheet" href="/src/styles/style-mobile.css">
    <style>
        #map-container { position:relative; width:100%; height:100%; }
        #map-status { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:#aaa; font-size:14px; z-index:10; pointer-events:none; }
        #map-status.hidden { display:none; }
        #map-status.error .spinner { display:none; }
        #map-status.error #status-text { color:#e94560; }
        .spinner { width:36px; height:36px; border:3px solid #333; border-top-color:#ffd60a; border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        #sidebar-toggle { display:none; position:fixed; top:10px; left:10px; z-index:20; background:#1a1a2e; color:#fff; border:1px solid #444; border-radius:4px; padding:6px 12px; font-size:18px; cursor:pointer; }
        @media (max-width:768px) {
            #sidebar-toggle { display:block; }
            .main-container .sidebar { position:fixed; left:-320px; top:0; bottom:0; width:300px; z-index:15; transition:left .3s; }
            .main-container .sidebar.open { left:0; }
            .main-container .content-area { margin-left:0; }
        }
    </style>
    <script type="module" src="/src/js/india-map.js"></script>
</head>
<body>
    <div class="main-container">
        <div class="content-area">
            <main id="main-content">
                <button id="sidebar-toggle" aria-label="Toggle sidebar">☰</button>
                <div id="map-container" class="map-container">
                    <div id="map-status">
                        <div class="spinner"></div>
                        <span id="status-text">Loading map data...</span>
                    </div>
                </div>
            </main>
        </div>
        <div class="sidebar">
            <div class="sidebar-content">
                <div class="branding">
                    <div class="logo">
                        <span>India Cinema Technology</span>
                    </div>
                </div>
                <nav class="nav-links">
                    <a href="/theater-tech/" class="nav-link">📐 Screen Size</a>
                    <a href="/theater-tech/seating.html" class="nav-link">💺 Seating</a>
                    <a href="/theater-tech/sound.html" class="nav-link">🔊 Sound</a>
                    <a href="/theater-tech/india.html" class="nav-link active">🇮🇳 India Map</a>
                </nav>
                <h2 id="page-title">India Cinema Heatmap</h2>
                <p id="page-description">Geographic distribution of cinema screens across India</p>
                <div class="sidebar-body">
                    <div id="map-legend" class="map-legend"></div>
                    <div id="city-detail" class="city-detail"></div>
                </div>
                <div class="sidebar-footer">
                    <div class="usage-info" style="font-size:12px;color:#ccc;border-top:1px solid #555;padding-top:10px;">
                        <span id="data-attribution"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
